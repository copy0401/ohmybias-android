# 每次 push 到 main：跑 JVM 引擎測試、組 release APK（R8）、發 pre-release 附上 APK。
# pre-release 固定 tag「pre-release」— 永遠只有一份，新 build 先刪舊的再重建（覆蓋）。
# 簽章金鑰不進 repo — 由 GitHub Secrets（KEYSTORE_B64 等四項）注入，
# 與本機 ~/.gradle/gradle.properties 用同一把 key → 簽章固定，可直接覆蓋安裝更新。
name: prerelease

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 還原簽章金鑰
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺 KEYSTORE_B64 secret — 不簽章就不發 pre-release"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: 測試 + 組 release APK
        env:
          OHMYBIAS_KEYSTORE: ${{ runner.temp }}/release.jks
          OHMYBIAS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          OHMYBIAS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          OHMYBIAS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: 取版本號、命名 APK
        id: meta
        run: |
          VERSION=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          APK="ohmybias-v${VERSION}-pre.${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${APK}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "apk=${APK}" >> "$GITHUB_OUTPUT"

      - name: 發 pre-release（刪舊的、重建 — 永遠只有一份）
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          gh release delete pre-release --cleanup-tag -y || true
          gh release create pre-release "${{ steps.meta.outputs.apk }}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "v${{ steps.meta.outputs.version }} pre.${GITHUB_RUN_NUMBER} (${{ steps.meta.outputs.short_sha }})" \
            --notes "$(printf '自動 pre-release build — %s\ncommit: %s' "$COMMIT_MSG" "$GITHUB_SHA")"
